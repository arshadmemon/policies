apiVersion: policies.kubewarden.io/v1
kind: ClusterAdmissionPolicy
metadata:
  name: enforce-trusted-registries
spec:
  module: registry://ghcr.io/kubewarden/policies/wildcard-policy:v0.1.0
  mode: protect
  mutating: false
  rules:
  - apiGroups: ["", "apps"]
    apiVersions: ["v1"]
    resources: ["pods", "deployments", "replicasets"]
    operations: ["CREATE", "UPDATE"]
  settings:
    rule:
      # Block anything that doesn't explicitly start with your trusted registry
      deny:
      - "nginx*"
      - "*docker.io*"
      - "library/*"
