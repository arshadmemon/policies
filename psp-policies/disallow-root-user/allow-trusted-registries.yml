apiVersion: policies.kubewarden.io/v1
kind: ClusterAdmissionPolicy
metadata:
  name: trusted-repos
spec:
  module: registry://ghcr.io/kubewarden/policies/trusted-repos:v2.0.3
  mode: protect
  mutating: false
  policyServer: default   # Ensure this explicitly maps to your running PolicyServer
  rules:
  - apiGroups: ["", "apps"]
    apiVersions: ["v1"]
    resources: ["pods", "deployments", "replicasets"]
    operations: ["CREATE", "UPDATE"]
  settings:
    registries:
      reject:
      - docker.io
      - myrepo.io
